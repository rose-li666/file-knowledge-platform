name: knowledge-platform
services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATA_DIR: /data
      MODEL_DIR: /opt/models/bge
      MODEL_CPU_THREADS: "2"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-20971520}"
    volumes:
      - platform_data:/data
    restart: unless-stopped
volumes:
  platform_data:
